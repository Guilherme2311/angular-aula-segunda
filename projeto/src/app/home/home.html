<h1>Lista de Atividas</h1>

<section class="formulario">
    <!--Por causa do FormsModule o Angular vai gerenciar o submit do formulário-->
    <form (ngSubmit)="adicionar()">
        <label for="nome">Atividade: </label>
        <!-- [(ngModel)]="nome" cria um vínculo de duas mãos com o TS-->
        <input type="text" id="nome" name="nome" [(ngModel)] placeholder="Nova Atividade">

        <button type="submit">Salvar</button>
        <button type="submit" (click)="cancelar()">Cancelar</button>
    </form>
</section>
<section>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Atividade/th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td> Tomar remédio</td>
                <td>"Editar" | "Excluir"</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>2</td>
                <td>Comer</td>
                <td>"Editar" | "Excluir"</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>3</td>
                <td>Dormir</td>
                <td>"Editar" | "Excluir"</td>
            </tr>
        </tbody>
        <!-- Vamos começar a fazer a varredura do vetor lista -> Somente leitura de valores -->
        <tbody>
            @for (Atividade of lista; track atividade.id) {
                <tr>
                    <!--Vínculo simples entre o html e Ts-->
                    <td>{{atividade.id}}</td>
                    <td>{{atividade.nome}}</td>
                    <td>"Editar" | "Excluir"</td>
                </tr>
            }
        </tbody>
    </table>
</section>
